name: Publier l'extension

# Déclenché par une modification sous extension/, mais ne publie que si la version
# de manifest.json a réellement changé. La source de vérité est donc le manifeste :
# on incrémente "version" dedans, on pousse, et la publication part toute seule.
on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/release-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # nécessaire pour voir les tags déjà posés
          ref: ${{ github.ref_name }}  # rester sur la branche, pour pouvoir y pousser

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lire la version du manifeste
        id: v
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "tag=extension-v$VERSION" >> "$GITHUB_OUTPUT"

      # Le tag fait office de registre des versions déjà publiées : c'est plus
      # robuste qu'un diff entre commits (résiste aux re-runs et aux force-push).
      - name: Cette version est-elle déjà publiée ?
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "publier=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${{ steps.v.outputs.version }} déjà publiée — rien à faire."
          else
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          fi

      # Sans ce garde-fou, modifier l'extension en oubliant sa version passait
      # inaperçu : le workflow disait « déjà publiée » et le correctif restait
      # sur place, sans jamais atteindre Firefox.
      - name: Version oubliée ?
        if: steps.check.outputs.publier == 'non' && github.event_name == 'push'
        shell: bash
        run: |
          AVANT="${{ github.event.before }}"
          if [ -z "$AVANT" ] || [ "$AVANT" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::Pas de base de comparaison — contrôle ignoré."
            exit 0
          fi
          MODIF=$(git diff --name-only "$AVANT" "${{ github.sha }}" -- extension/ | grep -v '^extension/manifest\.json$' || true)
          if [ -n "$MODIF" ]; then
            echo "::error::L'extension a changé mais sa version reste ${{ steps.v.outputs.version }}, déjà publiée. Incrémenter extension/manifest.json."
            echo "Fichiers modifiés :"
            echo "$MODIF" | sed 's/^/  /'
            exit 1
          fi
          echo "Aucun fichier de l'extension modifié — rien à publier."

      # Sans ce contrôle, des secrets absents produisent une erreur d'authentification
      # obscure au milieu de la sortie de web-ext, plusieurs minutes plus tard.
      - name: Vérifier la présence des secrets AMO
        if: steps.check.outputs.publier == 'oui'
        env:
          CLE:    ${{ secrets.AMO_API_KEY }}
          SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          manque=""
          [ -z "$CLE" ]    && manque="$manque AMO_API_KEY"
          [ -z "$SECRET" ] && manque="$manque AMO_API_SECRET"
          if [ -n "$manque" ]; then
            echo "::error::Secret(s) manquant(s) :$manque — les définir avec 'gh secret set <NOM>'"
            exit 1
          fi
          echo "Les deux secrets AMO sont présents."

      # --self-hosted est indispensable ici : sans lui, le linter applique les règles
      # des extensions hébergées par Mozilla et rejette `update_url` en ERREUR, alors
      # que cette clé est précisément ce qui permet à une extension auto-hébergée de
      # se mettre à jour toute seule.
      - name: Vérifier l'extension
        if: steps.check.outputs.publier == 'oui'
        run: npx --yes web-ext lint --source-dir=extension --self-hosted

      # Canal unlisted : signature quasi immédiate, sans revue éditoriale.
      # Pour passer en public plus tard, remplacer par --channel=listed (la toute
      # première soumission listed doit se faire à la main sur addons.mozilla.org).
      # Les identifiants passent par l'environnement, jamais en arguments : web-ext
      # lit nativement WEB_EXT_API_KEY / WEB_EXT_API_SECRET, et une ligne de commande
      # est visible dans la liste des processus comme dans les messages d'erreur.
      - name: Signer via l'API AMO
        if: steps.check.outputs.publier == 'oui'
        env:
          WEB_EXT_API_KEY:    ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir=extension \
            --artifacts-dir=dist \
            --channel=unlisted

      - name: Publier le .xpi signé en release
        if: steps.check.outputs.publier == 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Extension ${{ steps.v.outputs.version }}
          body: |
            Extension re:cast ${{ steps.v.outputs.version }}, signée par Mozilla (canal unlisted).

            Installation : télécharger le `.xpi` puis l'ouvrir dans Firefox.
            Les installations existantes se mettront à jour toutes seules.
          files: dist/*.xpi

      # updates.json est le manifeste que Firefox interroge pour savoir si une
      # nouvelle version existe. Il est écrit APRÈS la release, pour que le lien
      # de téléchargement qu'il contient soit déjà valide.
      - name: Mettre à jour updates.json
        if: steps.check.outputs.publier == 'oui'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG:     ${{ steps.v.outputs.tag }}
          DEPOT:   ${{ github.repository }}
        run: |
          NOM=$(basename "$(ls dist/*.xpi | head -1)")
          export LIEN="https://github.com/$DEPOT/releases/download/$TAG/$NOM"
          echo "Lien de mise à jour : $LIEN"
          node - <<'EOF'
          const fs = require('fs');
          const id = require('./extension/manifest.json').browser_specific_settings.gecko.id;
          const j  = JSON.parse(fs.readFileSync('updates.json', 'utf8'));

          j.addons[id] = j.addons[id] || { updates: [] };
          const liste = j.addons[id].updates.filter(u => u.version !== process.env.VERSION);
          liste.push({ version: process.env.VERSION, update_link: process.env.LIEN });
          liste.sort((a, b) => a.version.localeCompare(b.version, undefined, { numeric: true }));

          j.addons[id].updates = liste;
          fs.writeFileSync('updates.json', JSON.stringify(j, null, 2) + '\n');
          EOF

      # Ce commit ne touche qu'updates.json, hors du filtre `paths` du workflow :
      # il ne peut donc pas déclencher une nouvelle exécution en boucle.
      #
      # Le push est RÉESSAYÉ, et ce n'est pas de la prudence gratuite. La
      # signature AMO prend plusieurs minutes, pendant lesquelles le dépôt reçoit
      # sans mal d'autres commits — un dépôt à trois moitiés y invite. Le push
      # partait alors d'une base périmée et se faisait rejeter, l'étape échouait,
      # et updates.json restait en arrière. Silencieusement : la release existait,
      # le .xpi était bien publié, seul le fichier que Firefox interroge ne
      # bougeait pas. Les versions 0.1.6 et 0.1.7 ont été perdues ainsi.
      - name: Committer updates.json
        if: steps.check.outputs.publier == 'oui'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git diff --staged --quiet && echo "rien à committer" && exit 0
          git commit -m "updates.json : extension ${{ steps.v.outputs.version }}"

          for essai in 1 2 3 4 5; do
            if git push; then
              echo "updates.json poussé (essai $essai)"
              exit 0
            fi
            echo "Push rejeté — rebase sur origin/main puis nouvel essai ($essai/5)"
            git pull --rebase origin main || exit 1
            sleep $((essai * 3))
          done
          echo "::error::updates.json n'a pas pu être poussé après 5 essais."
          exit 1
